<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile information | DanceStar</title>
    <link rel="stylesheet" href="../styles.css">
    <script src="../profile-information.js" defer></script>
  </head>
  <body class="profile-information-page">
    <div class="mobile-screen">
      <div class="screen-scroll">
        <header class="app-header">
          <a class="header-button" href="notifications.html" aria-label="Notifications">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16V9a7 7 0 0 1 14 0v7l2 3H3ZM9 21a3 3 0 0 0 6 0M10 2a2 2 0 0 1 4 0"/></svg>
          </a>
          <img class="app-logo" src="../assets/dancestar_logo.png" alt="DanceStar" width="226" height="165">
          <a class="header-button" href="settings.html" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3 1-2h4l1 2 2 1 2-.2 2 3-1 2v3l1 2-2 3-2-.2-2 1-1 3h-4l-1-3-2-1-2 .2-2-3 1-2V9L3 7l2-3 2 .2Z" transform="translate(0 1) scale(1 .95)"/><circle cx="12" cy="12" r="3.5"/></svg>
          </a>
        </header>
        <main class="app-content profile-information">
          <div class="information-toolbar">
            <h1 class="page-title">Profile information</h1>
            <button class="information-edit" type="button" id="edit-profile">Edit</button>
          </div>
          <form id="profile-information-form">
            <fieldset disabled>
              <label class="information-field">First name<input name="firstName" autocomplete="given-name" value="John" disabled></label>
              <label class="information-field">Last name<input name="lastName" autocomplete="family-name" value="Smith" disabled></label>
              <label class="information-field"><span class="information-field-heading">E-mail<span class="verification-flag" data-verification="email" role="status">Verified</span></span><input name="email" type="email" autocomplete="email" placeholder="Not provided"></label>
              <label class="information-field"><span class="information-field-heading">Phone<span class="verification-flag" data-verification="phone" role="status">Verified</span></span><input name="phone" type="tel" inputmode="numeric" pattern="[0-9]*" autocomplete="tel" placeholder="Not provided"></label>
              <label class="information-field">Date of birth<input name="dateOfBirth" type="text" inputmode="numeric" placeholder="DD/MM/YYYY" maxlength="10" pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}" autocomplete="bday" title="Enter a valid date as DD/MM/YYYY" disabled></label>
              <label class="information-field">Gender<select name="gender" disabled><option value="" disabled>Not provided</option><option>Female</option><option>Male</option></select></label>
              <label class="information-field">Country<input name="country" list="country-options" autocomplete="off" placeholder="Select or type a country"><datalist id="country-options"></datalist></label>
            </fieldset>
            <p class="information-status" role="status"></p>
          </form>
        </main>
      </div>
      <div class="information-actions" hidden>
        <button class="information-edit" type="submit" form="profile-information-form">Save</button>
        <button class="information-cancel" type="button">Cancel</button>
      </div>
      <nav class="bottom-nav" aria-label="Main navigation">
        <a href="index.html" >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-8 9 8v11h-6v-6H9v6H3Z"/></svg>
          <span>Home</span>
        </a>
        <a href="schedule.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="18" rx="1"/><path d="M7 2v5M17 2v5M2 9h20M7 13h.01M12 13h.01M17 13h.01M7 18h.01M12 18h.01M17 18h.01"/></svg>
          <span>Schedule</span>
        </a>
        <a href="news.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16V9a7 7 0 0 1 14 0v7l2 3H3ZM9 21a3 3 0 0 0 6 0M10 2a2 2 0 0 1 4 0"/></svg>
          <span>News</span>
        </a>
        <a href="live.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 8 6 4-6 4ZM6 7a8 8 0 0 0 0 10M3 4a12 12 0 0 0 0 16M18 7a8 8 0 0 1 0 10M21 4a12 12 0 0 1 0 16"/></svg>
          <span>Live</span>
        </a>
        <a href="profile.html" aria-current="page">
          <svg class="account-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6" r="5"/><path d="M2 23a10 10 0 0 1 20 0Z"/></svg>
          <span>Account</span>
        </a>
      </nav>
    </div>
  </body>
</html>
