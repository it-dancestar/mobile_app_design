<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings | DanceStar</title>
  <link rel="stylesheet" href="../styles.css">
  <script src="../settings.js" defer></script>
</head>
<body class="settings-page">
  <div class="mobile-screen">
    <div class="screen-scroll">
      <header class="app-header">
          <a class="header-button" href="notifications.html" aria-label="Notifications">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16V9a7 7 0 0 1 14 0v7l2 3H3ZM9 21a3 3 0 0 0 6 0M10 2a2 2 0 0 1 4 0"/></svg>
          </a>
          <img class="app-logo" src="../assets/dancestar_logo.png" alt="DanceStar" width="226" height="165">
          <button class="header-button" type="button" aria-label="Settings" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3 1-2h4l1 2 2 1 2-.2 2 3-1 2v3l1 2-2 3-2-.2-2 1-1 3h-4l-1-3-2-1-2 .2-2-3 1-2V9L3 7l2-3 2 .2Z" transform="translate(0 1) scale(1 .95)"/><circle cx="12" cy="12" r="3.5"/></svg>
          </button>
        </header>
      <main class="app-content settings-content" aria-label="Settings">
        <section aria-labelledby="permissions-title">
          <h1 id="permissions-title">Permissions</h1>
          <label class="settings-row" for="notification-permission">
            <span>Notifications</span>
            <input class="settings-switch" id="notification-permission" type="checkbox" role="switch">
          </label>
        </section>
        <section aria-labelledby="legal-title">
          <h2 id="legal-title">Legal</h2>
          <div class="settings-legal-list">
            <a class="settings-row" href="terms.html?from=settings.html"><span>Terms &amp; conditions</span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="4"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></a>
            <a class="settings-row" href="privacy.html?from=settings.html"><span>Privacy policy</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 2a10 10 0 1 0 10 12M15 3a10 10 0 0 1 7 8"/><rect x="8" y="10" width="8" height="7" rx="1"/><path d="M10 10V8a2 2 0 0 1 4 0v2"/></svg></a>
          </div>
        </section>
      </main>
    </div>
    <nav class="bottom-nav" aria-label="Main navigation">
        <a href="index.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-8 9 8v11h-6v-6H9v6H3Z"/></svg>
          <span>Home</span>
        </a>
        <a href="schedule.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="18" rx="1"/><path d="M7 2v5M17 2v5M2 9h20M7 13h.01M12 13h.01M17 13h.01M7 18h.01M12 18h.01M17 18h.01"/></svg>
          <span>Schedule</span>
        </a>
        <a href="news.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16V9a7 7 0 0 1 14 0v7l2 3H3ZM9 21a3 3 0 0 0 6 0M10 2a2 2 0 0 1 4 0"/></svg>
          <span>News</span>
        </a>
        <a href="live.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 8 6 4-6 4ZM6 7a8 8 0 0 0 0 10M3 4a12 12 0 0 0 0 16M18 7a8 8 0 0 1 0 10M21 4a12 12 0 0 1 0 16"/></svg>
          <span>Live</span>
        </a>
        <a href="profile.html" >
          <svg class="account-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6" r="5"/><path d="M2 23a10 10 0 0 1 20 0Z"/></svg>
          <span>Account</span>
        </a>
      </nav>
  </div>
</body>
</html>
