<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile | DanceStar</title>
    <link rel="stylesheet" href="../styles.css">
    <script src="../events.js" defer></script>
    <script src="../profile-menu.js" defer></script>
  </head>
  <body>
    <div class="mobile-screen">
      <div class="screen-scroll">
      <header class="app-header">
          <button class="header-button" type="button" aria-label="Notifications">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16V9a7 7 0 0 1 14 0v7l2 3H3ZM9 21a3 3 0 0 0 6 0M10 2a2 2 0 0 1 4 0"/></svg>
          </button>
          <img class="app-logo" src="../assets/dancestar_logo.png" alt="DanceStar">
          <button class="header-button" type="button" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3 1-2h4l1 2 2 1 2-.2 2 3-1 2v3l1 2-2 3-2-.2-2 1-1 3h-4l-1-3-2-1-2 .2-2-3 1-2V9L3 7l2-3 2 .2Z" transform="translate(0 1) scale(1 .95)"/><circle cx="12" cy="12" r="3.5"/></svg>
          </button>
        </header>
      <section class="profile" aria-label="Profile">
        <div class="profile-avatar" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="18" r="8" fill="currentColor" />
            <path d="M9 44v-5a15 15 0 0 1 30 0v5" fill="currentColor" />
          </svg>
        </div>
        <div class="profile-details">
          <span class="profile-name">John Smith</span>
          <span class="profile-level">Junior</span>
        </div>
        <div class="profile-menu">
          <button class="profile-menu-toggle" type="button" aria-label="Profile menu" aria-expanded="false" aria-controls="profile-menu-options">
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
          </button>
          <div class="profile-menu-options" id="profile-menu-options" hidden>
            <button type="button" data-action="profile-information">Profile information</button>
            <button type="button" data-action="log-out">Log out</button>
          </div>
        </div>
      </section>
      <main class="app-content">
        <section class="content-section" aria-labelledby="routines-title">
          <h2 id="routines-title">Routines</h2>
          <div class="section-content routine-list" id="routines-content"></div>
        </section>
        <section class="content-section" aria-labelledby="qualifiers-title">
          <h2 id="qualifiers-title">Qualifiers</h2>
          <div class="section-content qualifier-image-list" id="qualifiers-content">
            <a class="qualifier-image-card" href="live.html">
              <img src="../assets/porto1-1.jpg" alt="" loading="lazy">
              <span>Portugal Qualifier</span>
            </a>
            <a class="qualifier-image-card" href="schedule.html">
              <img src="../assets/bratislava1.jpg" alt="" loading="lazy">
              <span>Slovakia Qualifier</span>
            </a>
          </div>
        </section>
        <section class="content-section" aria-labelledby="certificates-title">
          <h2 id="certificates-title">Certificates</h2>
          <div class="section-content" id="certificates-content"><p class="unavailable-text">Not available yet.</p></div>
        </section>
        <section class="content-section" aria-labelledby="results-title">
          <h2 id="results-title">Results</h2>
          <div class="section-content" id="results-content"><p class="unavailable-text">Not available yet.</p></div>
        </section>
      </main>
      </div>
      <nav class="bottom-nav" aria-label="Main navigation">
        <a href="index.html" >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-8 9 8v11h-6v-6H9v6H3Z"/></svg>
          <span>Home</span>
        </a>
        <a href="schedule.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="18" rx="1"/><path d="M7 2v5M17 2v5M2 9h20M7 13h.01M12 13h.01M17 13h.01M7 18h.01M12 18h.01M17 18h.01"/></svg>
          <span>Schedule</span>
        </a>
        <a href="news.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16V9a7 7 0 0 1 14 0v7l2 3H3ZM9 21a3 3 0 0 0 6 0M10 2a2 2 0 0 1 4 0"/></svg>
          <span>News</span>
        </a>
        <a href="live.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 8 6 4-6 4ZM6 7a8 8 0 0 0 0 10M3 4a12 12 0 0 0 0 16M18 7a8 8 0 0 1 0 10M21 4a12 12 0 0 1 0 16"/></svg>
          <span>Live</span>
        </a>
        <a href="profile.html" aria-current="page">
          <svg class="account-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6" r="5"/><path d="M2 23a10 10 0 0 1 20 0Z"/></svg>
          <span>Account</span>
        </a>
      </nav>
    </div>

    <!-- Compact routine template, independent of the original event buttons. -->
    <template id="routine-button-template">
      <button class="routine-button" type="button">
        <span class="routine-info">
          <span class="routine-category"></span>
          <span class="routine-title"></span>
          <span class="routine-date"></span>
        </span>
      </button>
    </template>

    <!-- Original shared event button template. -->
    <template id="event-button-template">
      <button class="event-button" type="button">
        <span class="event-art" aria-hidden="true"></span>
        <span class="event-info">
          <span class="event-category"></span>
          <span class="event-title"></span>
          <span class="event-date"></span>
        </span>
        <span class="event-action"></span>
      </button>
    </template>
  </body>
</html>
